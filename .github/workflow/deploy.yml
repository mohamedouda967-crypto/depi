  name: Deploy react
  on:
    push:
      branches:
        - master

  jobs:
    builds:
      runs-on: ubuntu-latest
      steps:
        -  uses: actions/checkout@v2
        -  run: docer login -u ${{ secrets.DOCKER_USERNAME }} -P ${{ secrets.Docker_PASSWORD}}
        -  run: docker build -t ouda/react-test -f dockerfile.dev .
        -  run: dokcer run -e CI=true ouda/react-test npm run test 